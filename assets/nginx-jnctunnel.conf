# jnctunnel - vhost nginx
# Dua listener lokal:
#   127.0.0.1:8083  HTTP/1.1 + WebSocket  (proxy_protocol dari payload shim)
#   127.0.0.1:8081  HTTP/2 / gRPC         (proxy_protocol dari haproxy)
# Port 80 dan 443 dipegang haproxy; ACME (http-01) dilayani di blok 8083
# karena semua trafik HTTP lewat payload shim lebih dulu.

map $http_upgrade $jnctunnel_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8083 proxy_protocol;
    server_name @DOMAIN@;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    access_log off;

    # --- ACME (http-01) -----------------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # --- Xray: VMess / VLESS / Trojan via WebSocket -------------------------
    location = /vmess {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jnctunnel_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /vless {
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jnctunnel_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /trojan {
        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jnctunnel_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Xray: HTTPUpgrade (path /up*) --------------------------------------
    location = /upvmess {
        proxy_pass http://127.0.0.1:10004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jnctunnel_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /upvless {
        proxy_pass http://127.0.0.1:10005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jnctunnel_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /uptrojan {
        proxy_pass http://127.0.0.1:10006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jnctunnel_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Xray: XHTTP --------------------------------------------------------
    location = /xhvless {
        proxy_pass http://127.0.0.1:12002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- API akun (bot/panel) ----------------------------------------------
    location /vps/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # --- SSH over WebSocket -------------------------------------------------
    location ~ ^/(ssh-ws|ws|ws-ssh|ssh)$ {
        proxy_pass http://127.0.0.1:2082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jnctunnel_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Catch-all: request umpan (decoy) dari klien payload dan browser biasa
    # mendapat 301 seperti sebelumnya. Klien payload tetap lanjut mengirim
    # request upgrade di koneksi yang sama.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8081 proxy_protocol http2;
    server_name @DOMAIN@;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    access_log off;

    location = /vmess-grpc {
        grpc_pass grpc://127.0.0.1:11001;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }

    location = /vless-grpc {
        grpc_pass grpc://127.0.0.1:11002;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }

    location = /trojan-grpc {
        grpc_pass grpc://127.0.0.1:11003;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
