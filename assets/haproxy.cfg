# jnctunnel - haproxy
# TLS 443 diterima di sini, lalu dipilah berdasarkan byte pertama:
#   PRI * HTTP/2.0  -> nginx 8081 (gRPC)
#   CONNECT ...     -> sshws 2082 (HTTP Custom)
#   HTTP biasa      -> nginx 8083 (WS, HTTPUpgrade, XHTTP)
#   lainnya         -> sshws 2082 (banner SSH)
# Semua backend lokal memakai proxy_protocol agar IP klien tidak hilang.

global
    log /dev/log local0 warning
    maxconn 4096
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client  12h
    timeout server  12h

frontend ft_tls
    bind *:443 ssl crt @PEM@ alpn h2,http/1.1
    tcp-request inspect-delay 5s
    tcp-request content accept if HTTP

    acl is_h2      req.payload(0,14) -m str "PRI * HTTP/2.0"
    acl is_connect req.payload(0,8)  -m str "CONNECT "

    use_backend bk_grpc  if is_h2
    use_backend bk_sshws if is_connect
    default_backend bk_http

backend bk_http
    server nginx_http 127.0.0.1:8083 send-proxy

backend bk_grpc
    server nginx_h2 127.0.0.1:8081 send-proxy

backend bk_sshws
    server sshws 127.0.0.1:2082 send-proxy
